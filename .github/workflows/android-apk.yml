name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Android workload
        run: dotnet workload install maui-android
      - name: Restore
        run: dotnet restore ReminderIntervalApp.csproj
      - name: Publish APK
        run: dotnet publish ReminderIntervalApp.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReminderIntervalApp-APK
          path: |
            **/bin/Release/net10.0-android/publish/*.apk
            **/bin/Release/net10.0-android/*.apk
          if-no-files-found: error
